{% extends "auctions/layout.html" %}
{% block body %}
{% load static %}

<!-- 🌟 Auction Emoji Background -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
  <div class="absolute w-full h-full flex flex-wrap justify-center items-center text-6xl opacity-10">
    <span class="animate-[float_6s_ease-in-out_infinite]">🏷️</span>
    <span class="animate-[spin_10s_linear_infinite]">💰</span>
    <span class="animate-[bounce_4s_ease-in-out_infinite]">🕰️</span>
    <span class="animate-[float_8s_ease-in-out_infinite]">📦</span>
    <span class="animate-[spin_12s_linear_infinite]">🔨</span>
    <span class="animate-[bounce_6s_ease-in-out_infinite]">🎯</span>
  </div>
  <div class="absolute inset-0 bg-gradient-to-br from-yellow-50 via-white to-yellow-100 opacity-20 animate-[shimmer_15s_linear_infinite]"></div>
</div>

<!-- 🔐 Animated Login Component -->
<div class="relative z-10 dark:bg-gray-900 flex justify-center items-center h-screen animate-[fadeSlide_0.8s_ease-out]">
  <!-- Left: Image Section -->
  <div class="relative w-1/2 h-screen hidden lg:block flex justify-center items-center animate-[fadeIn_1s_ease-out]">
    <p class="absolute inset-0 flex flex-col z-10 text-xl text-center mt-[30vh] text-white animate-[popIn_0.6s_ease-out]">
      An Auction Platform for <br />
      <strong>Collectors</strong>
    </p>
    <img
      src="{% static 'auctions/left-bg.png' %}"
      alt="Auction Background"
      class="absolute object-fill w-full h-full z-0"
    />
  </div>

  <!-- Right: Login Form -->
  <div class="lg:p-36 md:p-52 sm:p-20 p-8 w-full lg:w-1/2 animate-[fadeUp_0.8s_ease-out]">
    
    <!-- 🪄 Auction Emoji Banner -->
    <div class="w-full text-center py-6 animate-[fadeSlide_1s_ease-out]">
      <div class="inline-flex items-center justify-center space-x-4 text-4xl font-bold text-yellow-600 animate-[pulseGlow_3s_ease-in-out_infinite]">
        <span class="animate-[bounce_3s_ease-in-out_infinite]">🔨</span>
        <span class="animate-[spin_8s_linear_infinite]">🏷️</span>
        <span class="animate-[float_5s_ease-in-out_infinite]">💰</span>
        <span class="animate-[bounce_4s_ease-in-out_infinite]">📦</span>
        <span class="animate-[float_6s_ease-in-out_infinite]">🎯</span>
        <span class="animate-[spin_10s_linear_infinite]">🕰️</span>
      </div>
      <p class="mt-2 text-lg text-gray-300 animate-[fadeUp_1s_ease-out]">Bid Boldly. Win Big. 💸</p>
    </div>

    {% if message %}
    <div class="flex bg-blue-100 rounded-lg p-4 mb-4 text-sm text-blue-700 animate-[popIn_0.5s_ease-out]" role="alert">
      <svg class="w-5 h-5 inline mr-3" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
      </svg>
      <div>
        <span class="font-medium">{{ message }}</span>
      </div>
    </div>
    {% endif %}

    <h1 class="text-2xl font-semibold mb-4 text-white animate-[popIn_0.6s_ease-out]">🔑Access Portal</h1>
    <form action="{% url 'login' %}" method="POST" class="space-y-4">
      {% csrf_token %}
      <!-- Username Input -->
      <div>
        <input
          type="text"
          id="username"
          name="username"
          class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 placeholder:text-gray-400"
          autocomplete="off"
          placeholder="👤Let’s start with your name"
        />
      </div>
      <!-- Password Input -->
      <div>
       <div class="relative">
  <input
    type="password"
    id="password"
    name="password"
    class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:border-blue-500 placeholder:text-gray-400"
    autocomplete="off"
    placeholder="🔒 Enter your password"
  />
  <button
    type="button"
    onclick="togglePassword()"
    class="absolute right-3 top-2 text-sm text-blue-500"
  >
    Show
  </button>
</div>

      </div>
      <!-- Forgot Password Link -->
     <div class="text-blue-500 animate-[fadeUp_0.7s_ease-out]">
  <a
    href="{% url 'forgot_password' %}"
    class="inline-block text-blue-500 font-medium hover:underline transition duration-300 ease-in-out transform hover:scale-105 hover:-translate-y-1 hover:rotate-[1deg] hover:shadow-lg"
  >
    🔐 Forgot Password?
  </a>
</div>

      <!-- Login Button -->
      <button
        type="submit"
        class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-yellow-400 to-yellow-600 hover:from-yellow-500 hover:to-yellow-700 text-white font-bold py-2 px-4 rounded-md shadow-md transition duration-300 ease-in-out transform hover:scale-105 animate-[pulseGlow_2s_ease-in-out_infinite]"
      >
        🔐 Login Securely
      </button>
    </form>
    <!-- Sign up Link -->
    <div class="mt-6 text-center animate-[fadeUp_0.9s_ease-out]">
      <a
        href="{% url 'register' %}"
        class="inline-block bg-gradient-to-r from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-semibold py-2 px-4 rounded-md shadow-md transition duration-300 ease-in-out transform hover:scale-105"
      >
        📝 Register Now
      </a>
    </div>
  </div>
</div>

<!-- 🎬 Custom Animations -->
<style>
@keyframes fadeSlide {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes popIn {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-25px); }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0px rgba(59,130,246,0.4); text-shadow: 0 0 0px rgba(255,193,7,0.4); }
  50% { box-shadow: 0 0 10px rgba(59,130,246,0.6); text-shadow: 0 0 10px rgba(255,193,7,0.6); }
}
</style>

{% endblock %}
