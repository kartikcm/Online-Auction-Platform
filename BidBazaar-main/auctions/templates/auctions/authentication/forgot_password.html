{% extends 'auctions/layout.html' %}
{% block body %}

{% if message %}
  <div
    class="flex bg-blue-100 rounded-lg p-4 my-4 text-sm text-blue-700 animate-[popIn_0.5s_ease-out]"
    role="alert"
  >
    <svg class="w-5 h-5 inline mr-3" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
    </svg>
    <div><span class="font-medium">{{ message }}</span></div>
  </div>
{% endif %}

<div class="flex justify-center items-center w-[100vw] min-h-[100vh] bg-gray-900 perspective-[1000px] animate-[fadeSlide_0.8s_ease-out]">
  <div class="w-96 p-6 bg-gray-800 rounded-xl shadow-2xl transform transition duration-500 hover:rotate-x-[4deg] hover:rotate-y-[2deg] hover:scale-[1.03] hover:shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
    <h2 class="text-4xl font-bold mb-6 text-center text-gray-200 animate-[popIn_0.6s_ease-out]">🔐 Reset Password</h2>
    <form action="{% url 'forgot_password' %}" method="POST" class="space-y-6">
      {% csrf_token %}
      <div class="text-gray-300 animate-[fadeUp_0.6s_ease-out]">
        <label for="username" class="block mb-2">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="👤 Your auction alias"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-950 transition duration-300 transform hover:scale-105 hover:shadow-inner hover:shadow-blue-500/30"
          required
        >
      </div>
      <div class="text-gray-300 animate-[fadeUp_0.8s_ease-out]">
        <label for="email" class="block mb-2">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="📧 Registered email address"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-950 transition duration-300 transform hover:scale-105 hover:shadow-inner hover:shadow-blue-500/30"
          required
        >
      </div>
      <div class="flex justify-center items-center animate-[fadeUp_1s_ease-out]">
        <button
          type="submit"
          class="bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white font-semibold py-2 px-6 rounded-md shadow-lg transition duration-300 transform hover:scale-105 hover:-translate-y-1 hover:rotate-[1deg] hover:shadow-[0_10px_20px_rgba(59,130,246,0.6)]"
        >
          🔁 Reset Password
        </button>
      </div>
    </form>
  </div>
</div>

<!-- 🎬 Custom Animations -->
<style>
@keyframes fadeSlide {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>

{% endblock %}
