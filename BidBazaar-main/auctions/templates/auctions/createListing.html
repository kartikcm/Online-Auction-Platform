{% extends "auctions/layout.html" %}
{% block body %}

<section class="bg-gray-100 dark:bg-gray-900 min-h-screen flex flex-col justify-center items-center pt-[12vh] perspective-[1000px] animate-[fadeSlide_0.8s_ease-out]">

  {% if message %}
  <div class="flex bg-blue-100 rounded-lg p-4 mb-4 text-sm text-blue-700 animate-[popIn_0.5s_ease-out]" role="alert">
    <svg class="w-5 h-5 inline mr-3" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
    </svg>
    <div><span class="font-medium">{{ message }}</span></div>
  </div>
  {% endif %}

  <h2 class="text-gray-200 text-4xl font-bold mb-6 animate-[popIn_0.6s_ease-out]">📦 Create Listings</h2>

  <form action="{% url 'create_listing' %}" method="post" enctype="multipart/form-data"
    class="bg-gray-300 dark:bg-gray-800 gap-4 shadow-xl rounded-xl px-8 pt-6 pb-8 mb-4 w-[80%] transform transition duration-500 hover:scale-[1.02] hover:rotate-[0.5deg] hover:shadow-[0_20px_40px_rgba(0,0,0,0.4)] animate-[fadeUp_1s_ease-out]">
    
    {% csrf_token %}
    {{ form }}

    <div class="mt-6 flex justify-center items-center">
      <button
        class="bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white font-bold py-2 px-6 rounded-md shadow-lg transition duration-300 transform hover:scale-105 hover:-translate-y-1 hover:rotate-[1deg] hover:shadow-[0_10px_20px_rgba(59,130,246,0.6)]"
        id="submit-button"
      >
        🚀 Submit
      </button>
    </div>
  </form>
</section>

<!-- 🎬 Custom Animations -->
<style>
@keyframes fadeSlide {
  0% { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>

{% endblock %}
